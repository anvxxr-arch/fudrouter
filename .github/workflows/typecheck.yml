# Typecheck — runs the root `check` script in CI.
#
# This is a separate file from ci.yml on purpose. ci.yml's react-web job only
# builds (vite build): apps/console defines a `check` script (`tsc --noEmit`)
# that no workflow ever invoked, so a pure type error could still ship. Rather
# than rely on one job remembering to call one workspace's script — and have it
# rot again — this runs the root `check`, which fans out to every workspace that
# defines a `check` script.
#
# `packages/platform` holds the control plane's domain + persistence code and is
# loaded at RUNTIME by the PM2 daemons through packages/platform/ts-hooks.mjs, so nothing
# used to type-check it: a type error in the control plane (workers, billing,
# ssrf, credentials) was invisible until the code path ran in production.
#
# It used to be reached by a hard-coded `check:shared` path because it had no
# package.json. Per ADR-0001 it is now a workspace with its own `check` script,
# so the root `check` picks it up through --workspaces like every other package —
# one mechanism instead of two. It also grew a package.json, so the "no
# package.json, so the name is not the only problem" objection is closed.
name: Typecheck
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Root install (no --workspace): each package's devDependencies carry the
      # toolchain its check needs (e.g. typescript/tsc for react-web), so a
      # workspace-scoped `npm ci` would leave the other workspaces unable to run.
      - run: npm ci
      - run: npm run check
