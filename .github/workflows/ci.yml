name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binary
        run: go build -o fudrouter ./cmd/fudrouter

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fudrouter
          path: fudrouter

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: fudrouter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build release binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o fudrouter-linux-amd64 ./cmd/fudrouter
          GOOS=linux GOARCH=arm64 go build -o fudrouter-linux-arm64 ./cmd/fudrouter
          GOOS=darwin GOARCH=amd64 go build -o fudrouter-darwin-amd64 ./cmd/fudrouter
          GOOS=darwin GOARCH=arm64 go build -o fudrouter-darwin-arm64 ./cmd/fudrouter
          GOOS=windows GOARCH=amd64 go build -o fudrouter-windows-amd64.exe ./cmd/fudrouter

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fudrouter-linux-amd64
            fudrouter-linux-arm64
            fudrouter-darwin-amd64
            fudrouter-darwin-arm64
            fudrouter-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
