<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090B0F" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6C11'/%3E%3Ctext x='16' y='23' font-size='18' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23090B0F'%3Ef%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      The title, description, canonical, robots, og:*, twitter:* and JSON-LD tags
      are NOT here on purpose: server/lib/head.mjs strips every one of them and
      re-emits the set for the requested route. A tag left in this template is a
      duplicate the rewrite cannot see, and the site name/description below is
      exactly that problem — it disagrees with src/lib/seo.ts's SITE_NAME and
      SITE_DESCRIPTION, so the browser tab on a client-side navigation read a
      different product name than the server-rendered first paint a crawler got.
      The console title is set by Meta.tsx from the same registry.
    -->
    <meta name="apple-mobile-web-app-title" content="fudrouter" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
