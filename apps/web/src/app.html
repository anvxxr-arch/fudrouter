<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0B0D10" />
		<meta
			name="description"
			content="fudrouter — one API key, every model. A commercial AI router with per-request metering, rate limits, and auditable usage."
		/>
		<!--
			Preload the latin subset: it is needed on every page, and without this the
			first paint uses the fallback face and swaps a moment later. `crossorigin`
			is required for fonts even when same-origin.
		-->
		<link
			rel="preload"
			href="/fonts/plus-jakarta-sans-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
