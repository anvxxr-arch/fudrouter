name: fudrouter

# The fudrouter database does NOT live here. It runs on the consolidated
# hardened Postgres (project `infra-pg`, 127.0.0.1:5432, database `fudrouter`,
# role `fudrouter`) — see /home/dwizzy/infra-pg/docker-compose.yml, which
# explicitly replaces the old per-app `fudrouter-db` container on :5434.
#
# The old `fudrouter-pgdata` volume is intentionally left on disk (unreferenced)
# as a rollback safety net for the :5434 -> :5432 migration.
#
# Valkey is SHARED, host-native infra (like the Postgres above): systemd
# `valkey-server.service` on 127.0.0.1:6379, protected-mode with requirepass.
# Nothing here runs a Valkey container — two instances would fight over 6379 and
# split the keyspace. Consumers read `VALKEY_URL` (docs/specs/2026-09-30-
# platform-schema.md §12), so the endpoint is configuration, never hardcoded.
# fudrouter uses logical DB 1 of that instance to keep its keyspace separate
# from other projects on the same server. Losing Valkey loses no business data —
# PostgreSQL is the source of truth.
services: {}

