name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Every job runs against a real Postgres. The data plane's tests SKIP when
# DATABASE_URL is absent, so a CI without a database would report green while
# never exercising the code that actually serves traffic.
jobs:
  console:
    # Named for the app it exercises: apps/console (was react-web, a name that
    # outlived the directory). If branch protection still requires the old check
    # name, update it there — the job's identity is the app, not the history.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fudrouter
          POSTGRES_PASSWORD: fudrouter
          POSTGRES_DB: fudrouter
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U fudrouter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fudrouter:fudrouter@127.0.0.1:5434/fudrouter
      ORIGIN: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret
      CREDENTIALS_MASTER_KEY: ZnVkcm91dGVyLWNpLXRlc3QtbWFzdGVyLWtleS0zMmI=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --workspace apps/console
      - name: Apply the schema
        # ops/migrate.sh is the ONLY migration path (spec §13): it applies
        # every db/migrations/*.sql in order and records each in
        # schema_migration.
        run: |
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }
          ./ops/migrate.sh
      # `check` (tsc --noEmit) runs in typecheck.yml across every workspace, so
      # this job does not repeat it. It DOES run the unit suite: the server-side
      # security helpers (IP/SSRF classification, the rate limiter, the RBAC
      # table) import nothing from the database, so they run here with no schema
      # and still catch a regression in the code that guards the loopback.
      - run: npm run build --workspace apps/console
      - run: npm test --workspace apps/console

  contracts:
    # No database and no `npm ci`: the contract gate imports node builtins only,
    # so it cannot be skipped for an environment reason and cannot be broken by a
    # dependency. It is the cheapest job here and the one that catches a silent
    # route change — the failure mode with no natural detector.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails when the live route tables (Go ServeMux + Express registrations) no
      # longer match packages/contracts/routes.json, or when management.yaml has
      # drifted from it. Also re-run across every workspace by typecheck.yml's
      # `npm run check`, so this job makes the failure explicit and named.
      - name: Surface lock and OpenAPI staleness
        working-directory: packages/contracts
        run: npm run check
      - name: Contract regression tests
        working-directory: packages/contracts
        run: node --test

  router:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fudrouter
          POSTGRES_PASSWORD: fudrouter
          # NOT `fudrouter`: the suite carries a guard that refuses the
          # application database by name (tests/helpers.go, productionDatabases),
          # because the documented local workflow sources the production DSN and
          # the tests insert/delete rows. CI's database is already a throwaway
          # container, so it just has to be named like one.
          POSTGRES_DB: fudrouter_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U fudrouter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fudrouter:fudrouter@127.0.0.1:5434/fudrouter_test
      CREDENTIALS_MASTER_KEY: ZnVkcm91dGVyLWNpLXRlc3QtbWFzdGVyLWtleS0zMmI=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Must match the `toolchain` directive in apps/router/go.mod.
          # CI pinned 1.23 while production moved to 1.26.6, which built a
          # different compiler than the one the binary ships — a green CI run
          # then said nothing about the artifact. setup-go installs the
          # toolchain; the directive in go.mod selects it for the build.
          go-version: "1.26.6"
          cache-dependency-path: apps/router/go.sum
      # The data-plane tests are DB-backed on purpose, and they seed users, models
      # and providers. Without the schema every one of them dies on
      # `relation "user" does not exist` and the log reads like a code failure
      # rather than a job that never migrated. Same DDL the react-web job applies,
      # no node toolchain needed to get it.
      - name: Apply the schema
        run: |
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }
          # Same runner the react-web job and deploy use (spec §13) — one migration
          # path, no toolchain skew. The credential-split step self-skips here:
          # this job has no npm ci, so the `postgres` package is absent.
          ./ops/migrate.sh
      - run: go vet ./...
        working-directory: apps/router
      - run: go build ./...
        working-directory: apps/router
      # Dependency vulns are not visible to build, vet or test: a module that
      # compiles and passes every test can still carry a known CVE. This one
      # scan is what took the router from 30 advisories to 0; without it in CI
      # the next `go get` silently puts them back.
      - name: Scan dependencies for known vulnerabilities
        working-directory: apps/router
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$HOME/go/bin/govulncheck" ./...
      # -v so that any remaining t.Skip is visible in the log rather than
      # indistinguishable from a pass.
      - run: go test ./... -race -v
        working-directory: apps/router
